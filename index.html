<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TCAS Tracker</title>
<meta name="theme-color" content="#0b7f86">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1626;--surface:#162135;--ink:#e8eef8;--muted:#9aa9c2;--line:#2a3854;--accent:#45c3ca;--accent-soft:#12363a;--ok:#5fd397;--ok-soft:#14352a;--warn:#f0c14b;--warn-soft:#3b3014;--bad:#f07a98;--bad-soft:#401b28;--sh:0 8px 24px rgba(0,0,0,.25)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 "Prompt","IBM Plex Sans Thai",sans-serif}
main{max-width:1080px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.5rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:var(--sh)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--sh)}
.stat b{display:block;font-size:1.6rem;line-height:1.2}.stat span{color:var(--muted);font-size:.85rem}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:600px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);font-size:.92rem}
th{color:var(--muted);font-weight:500;font-size:.82rem}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.8rem;font-weight:500}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.bad{background:var(--bad-soft);color:var(--bad)}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 16px;border-radius:999px;transition:all .15s}
button.primary{background:var(--accent);color:#0e1626;border-color:var(--accent);font-weight:600}
button:disabled{opacity:0.5;cursor:not-allowed}
.f input,.f select,.f textarea{width:100%;font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.tb{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 12px}.tb input{flex:1;min-width:200px;font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
[hidden]{display:none!important}
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:40;padding:16px}
.lbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:24px;width:100%;max-width:400px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:.9rem;z-index:50}
#toast:empty{display:none}
</style>
</head>
<body>
<main>
<div id="login">
  <div class="lbox">
    <h1>🎓 TCAS Tracker</h1>
    <p class="sub">เข้าสู่ระบบด้วยรหัสผู้ใช้ (Main user หรือ Sub user)</p>
    <div class="f" style="margin-bottom:12px">
      <label style="font-size:.85rem;color:var(--muted)">Web app URL (ตั้งครั้งเดียว)</label>
      <input id="apiurl" placeholder="https://script.google.com/macros/s/…/exec">
    </div>
    <div class="f" style="margin-bottom:16px">
      <label style="font-size:.85rem;color:var(--muted)">รหัสผู้ใช้</label>
      <input id="code" type="password" placeholder="รหัสที่ได้รับ">
    </div>
    <button class="primary" id="doLogin" style="width:100%">เข้าสู่ระบบ</button>
    <button id="doTest" style="width:100%;margin-top:8px">🔍 ทดสอบการเชื่อมต่อ</button>
    <p id="lerr" style="margin:10px 0 0;font-size:.85rem;color:var(--bad)"></p>
  </div>
</div>

<div id="toast"></div>
<div id="who" style="margin-bottom:12px;font-size:.9rem;color:var(--muted)"></div>
<div id="home" hidden></div>
<div id="detail" hidden></div>
</main>

<script>
let API_URL = localStorage.getItem("tcas-api") || "";
let TOKEN = localStorage.getItem("tcas-token") || "";
let ME = null;
let STUDENTS = [];

const \$ = id => document.getElementById(id);
const esc = s => String(s || "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function toast(msg) {
  const t = \$("toast");
  t.textContent = msg;
  setTimeout(() => { t.textContent = ""; }, 3000);
}

if (API_URL) \$("apiurl").value = API_URL;

async function api(action, params = {}) {
  const url = \$("apiurl").value.trim() || API_URL;
  if (!url) throw new Error("กรุณากรอก Web app URL");
  
  const payload = Object.assign({ a: action, t: TOKEN }, params);
  const res = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  });
  
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || "เกิดข้อผิดพลาด");
  return json.data;
}

\$("doTest").onclick = async () => {
  const url = \$("apiurl").value.trim();
  if (!url) return \$("lerr").textContent = "กรุณากรอก URL ก่อนทดสอบ";
  \$("lerr").style.color = "var(--ink)";
  \$("lerr").textContent = "กำลังทดสอบ...";
  try {
    const res = await fetch(url);
    const j = await res.json();
    if (j.ok) {
      \$("lerr").style.color = "var(--ok)";
      \$("lerr").textContent = "✓ เชื่อมต่อ Google Apps Script สำเร็จ!";
    } else {
      throw new Error();
    }
  } catch (e) {
    \$("lerr").style.color = "var(--bad)";
    \$("lerr").textContent = "✗ ไม่สามารถเชื่อมต่อ URL นี้ได้ ตรวจสอบสิทธิ์สคริปต์";
  }
};

\$("doLogin").onclick = async () => {
  const btn = \$("doLogin");
  const url = \$("apiurl").value.trim();
  const code = \$("code").value.trim();
  \$("lerr").textContent = "";

  if (!url) return \$("lerr").textContent = "กรุณากรอก Web app URL";
  if (!code) return \$("lerr").textContent = "กรุณากรอกรหัสผู้ใช้";

  try {
    btn.disabled = true;
    \$("lerr").style.color = "var(--ink)";
    \$("lerr").textContent = "กำลังเข้าสู่ระบบ...";
    
    localStorage.setItem("tcas-api", url);
    API_URL = url;

    const data = await api("login", { code });
    TOKEN = data.token;
    ME = data.me;
    localStorage.setItem("tcas-token", TOKEN);

    \$("login").hidden = true;
    \$("home").hidden = false;
    toast("เข้าสู่ระบบสำเร็จ");
    loadData();
  } catch (err) {
    \$("lerr").style.color = "var(--bad)";
    \$("lerr").textContent = err.message === "invalid" ? "รหัสผู้ใช้ไม่ถูกต้อง" : err.message;
  } finally {
    btn.disabled = false;
  }
};

async function loadData() {
  try {
    const data = await api("list", { since: 0 });
    STUDENTS = data.students || [];
    renderHome();
  } catch (err) {
    toast("โหลดข้อมูลไม่สำเร็จ: " + err.message);
  }
}

function renderHome() {
  \$("who").innerHTML = `ผู้ใช้งาน: <b>${esc(ME.name)}</b> (${ME.role === "main" ? "Main User" : "Sub User"}) | <button onclick="logout()" style="padding:2px 10px;font-size:.8rem">ออกจากระบบ</button>`;
  
  const totalPrice = STUDENTS.reduce((sum, s) => sum + (+s.price || 0), 0);

  \$("home").innerHTML = `
    <h1>🎓 ติดตามนักเรียนที่สมัครคอร์ส</h1>
    <div class="stats">
      <div class="stat"><b>${STUDENTS.length} คน</b><span>นักเรียนทั้งหมด</span></div>
      <div class="stat"><b style="color:var(--ok)">฿${totalPrice.toLocaleString()}</b><span>สรุปยอดขายรวม</span></div>
    </div>
    <div class="panel">
      <div class="tb">
        <input id="q" placeholder="ค้นหาชื่อนักเรียน..." oninput="filterTable()">
        <button class="primary" onclick="addStudent()">+ เพิ่มนักเรียน</button>
      </div>
      <div class="scroll">
        <table>
          <thead>
            <tr><th>ชื่อ-สกุล</th><th>เบอร์โทร</th><th>รุ่น</th><th>ราคาคอร์ส</th><th>จัดการ</th></tr>
          </thead>
          <tbody id="stbody">
            ${renderTableRows(STUDENTS)}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function renderTableRows(list) {
  if (!list.length) return `<tr><td colspan="5" style="text-align:center;color:var(--muted)">ยังไม่มีข้อมูลนักเรียน</td></tr>`;
  return list.map(s => `
    <tr>
      <td><b>${esc(s.first)} ${esc(s.last)}</b> (${esc(s.nick || "-")})</td>
      <td>${esc(s.phone || "-")}</td>
      <td>${esc(s.batch || "-")}</td>
      <td>฿${(+s.price || 0).toLocaleString()}</td>
      <td><button onclick="editStudent('${s.id}')" style="padding:3px 10px;font-size:.8rem">ดู/แก้ไข</button></td>
    </tr>
  `).join("");
}

function filterTable() {
  const q = \$("q").value.toLowerCase();
  const filtered = STUDENTS.filter(s => (s.first + s.last + s.nick).toLowerCase().includes(q));
  \$("stbody").innerHTML = renderTableRows(filtered);
}

async function addStudent() {
  const first = prompt("กรอกชื่อนักเรียน:");
  if (!first) return;
  const newSt = { id: "s" + Date.now().toString(36), first: first, last: "", nick: "", price: 0, batch: "DEK71" };
  try {
    await api("save", { s: newSt });
    STUDENTS.push(newSt);
    renderHome();
    toast("เพิ่มนักเรียนเรียบร้อย");
  } catch (err) {
    toast("บันทึกไม่สำเร็จ: " + err.message);
  }
}

function editStudent(id) {
  const s = STUDENTS.find(x => x.id === id);
  if (!s) return;
  \$("home").hidden = true;
  \$("detail").hidden = false;
  
  \$("detail").innerHTML = `
    <button onclick="backToHome()">← กลับหน้ารายชื่อ</button>
    <div class="panel" style="margin-top:12px">
      <h2>แก้ไขข้อมูล: ${esc(s.first)}</h2>
      <div class="f" style="display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">
        <div><label>ชื่อ</label><input id="efirst" value="${esc(s.first)}"></div>
        <div><label>นามสกุล</label><input id="elast" value="${esc(s.last)}"></div>
        <div><label>ชื่อเล่น</label><input id="enick" value="${esc(s.nick)}"></div>
        <div><label>เบอร์โทร</label><input id="ephone" value="${esc(s.phone)}"></div>
        <div><label>ราคาคอร์ส (บาท)</label><input id="eprice" type="number" value="${+s.price || 0}"></div>
      </div>
      <button class="primary" onclick="saveEdit('${s.id}')" style="margin-top:16px">บันทึกข้อมูล</button>
    </div>
  `;
}

async function saveEdit(id) {
  const s = STUDENTS.find(x => x.id === id);
  if (!s) return;
  s.first = \$("efirst").value;
  s.last = \$("elast").value;
  s.nick = \$("enick").value;
  s.phone = \$("ephone").value;
  s.price = \$("eprice").value;

  try {
    await api("save", { s });
    toast("บันทึกข้อมูลแล้ว");
    backToHome();
  } catch (err) {
    toast("เกิดข้อผิดพลาด: " + err.message);
  }
}

function backToHome() {
  \$("detail").hidden = true;
  \$("home").hidden = false;
  renderHome();
}

function logout() {
  localStorage.removeItem("tcas-token");
  TOKEN = "";
  \$("home").hidden = true;
  \$("login").hidden = false;
  \$("code").value = "";
  \$("who").innerHTML = "";
}

if (TOKEN && API_URL) {
  api("me").then(me => {
    ME = me;
    \$("login").hidden = true;
    \$("home").hidden = false;
    loadData();
  }).catch(() => {
    logout();
  });
}
</script>
</body>
</html>
