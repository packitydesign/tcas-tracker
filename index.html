:root{--bg:#f6f8fc;--line:#e4e9f2;--accent-soft:#e0f5f3;--r:16px;--sh:0 1px 2px rgba(23,35,59,.05),0 8px 24px rgba(23,35,59,.06)}

button,.btnl{border-radius:999px;padding:7px 16px;transition:transform .08s,background .15s}

function hsChart(st){const el=$("hc0");if(!el)return;const S2=hsubs(st);if(!S2.length){el.innerHTML="";return}
  const A=S2.map(s=>hsAgg(st,s)),mx=Math.max(1,...A.map(a=>Math.max(a.plan,a.done,a.total)))*1.1;
  const W=Math.max(430,S2.length*104+40),H=240,Lf=38,B=44,T=12,ph=H-B-T,gw=(W-Lf)/S2.length,bw=Math.min(28,gw/3);
  let o=`<svg viewBox="0 0 ${W}${H}" width="${W}" height="${H}" role="img" aria-label="กราฟแท่งเนื้อหา ม.ปลาย แผนเทียบเรียนจริงรายวิชา">`;
  for(let i=0;i<=4;i++){const y=T+ph-ph*i/4;o+=`<line x1="${Lf}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="\${Lf-5}" y="${y+4}" font-size="11" text-anchor="end">${Math.round(mx*i/4)}</text>`}
  S2.forEach((s,i)=>{const x=Lf+i*gw+gw/2;
    [[A[i].plan,"var(--plan)",-bw-2],[A[i].done,"var(--accent)",2]].forEach(([v,c,dx])=>{const h=ph*v/mx;o+=`<rect x="\${x+dx}" y="${T+ph-h}" width="${bw}" height="${h}" rx="3" fill="${c}"/><text x="\${x+dx+bw/2}" y="${T+ph-h-4}" font-size="11" text-anchor="middle">${fh(v)}</text>`});
    o+=`<text x="\${x}" y="${H-24}" font-size="12" text-anchor="middle">${s}</text><text x="\${x}" y="${H-9}" font-size="10" text-anchor="middle">ทั้งหมด ${fh(A[i].total)} ชม.</text>`});
  el.innerHTML=o+"</svg>"}

function hsHtml(st){
  const L=hsAll(st),a=hsAgg(st),pc=a.total?Math.round(a.done/a.total*100):0,g=a.done-a.plan,cw=mon(TODAY),tw=hwtot(st,cw);

  const needT=a.n&&a.total-a.done<.05?"เรียนครบแล้ว":over?`เลยกำหนด \${over} แพ็ค`:need?fh(need)+" ชม./สัปดาห์":"–";

  <div class="stat"><b class="\${near&&near.days<0?"dng":""}">${near?(near.days<0?"เลย "+(-near.days):near.days)+" วัน":"–"}</b><span>${near?"หมดอายุใกล้สุด: "+esc(near.p.s)+(near.p.term?" "+esc(near.p.term):"")+" ("+fd(near.exp)+")":"ยังไม่มีแพ็คที่ต้องนับถอยหลัง"}</span></div></div>`;

  <section class="panel"><h2>📝 สรุปรายแพ็ค</h2><div class="scroll"><table><thead><tr><th>แพ็ค</th><th>แผน / จริง / ทั้งหมด (ชม.)</th><th>สถานะ</th><th>ต้องจบตามแผนอีก</th><th>หมดอายุอีก</th></tr></thead><tbody>`+
    L.map(x=>`<tr><td>\${SE[x.p.s]||""} ${esc(x.p.s)}${x.p.term?" · "+esc(x.p.term):""}<div class="src">${esc(x.p.n)}</div></td><td>${fh(x.plan)} / ${fh(x.done)} /${fh(x.total)}</td><td>${x.fin?'<span class="chip ok">ครบแล้ว</span>':chip(x)}</td><td>${x.fin||x.pdays==null?"–":x.pdays<0?`<span class="chip bad">เลย ${-x.pdays} วัน</span>`:x.pdays+" วัน"}</td><td>\${x.fin||x.days==null?"–":x.days<0?'<span class="chip bad">หมดอายุแล้ว</span>':x.days+" วัน"}</td></tr>`).join("")+`</tbody></table></div></section>`+hsWeeklyHtml(st):"";
  return`<div id="tab-hs"\${tab==="hs"?"":" hidden"}><p class="sub">ใช้ข้อมูลรายแพ็คจากโบรชัวร์เนื้อหา ม.ปลาย: ชั่วโมงคลิปจริง และอายุคอร์ส (นับจากวันที่สมัคร) ติ๊กแพ็คที่น้องสมัคร ใส่วันที่สมัคร แล้วกำหนดวันเริ่ม/วันจบตามแผนของแต่ละแพ็ค (เว้นว่าง = ใช้วันที่สมัครถึงวันหมดอายุคอร์ส) ถ้าน้องได้อายุคอร์สเพิ่ม (เช่น สมัครครบ 3 คอร์ส ได้ 12 เดือน) แก้ช่อง อายุ (เดือน) ได้</p>${stats}${dash}<h2>📦 แพ็คที่สมัคร และรายการเรียน</h2>`+

function canAdd(){return !readOnly&&(mode!=="shared"||ME.owner||ME.reg)}
function canEdit(st){if(readOnly)return false;if(mode!=="shared"||ME.owner)return true;if(!ME.reg)return false;return !st.staffId||st.staffId===ME.id}
function ask(msg){return new Promise(res=>{const d=$("dlg");d.innerHTML=`<div class="dbox" role="dialog" aria-modal="true"><p style="margin:0 0 14px">\${esc(msg)}</p><div class="row" style="justify-content:flex-end"><button id="dn">ยกเลิก</button><button class="primary" id="dy">ตกลง</button></div></div>`;d.hidden=false;
  const done=v=>{d.hidden=true;d.innerHTML="";res(v)};$("dy").onclick=()=>done(true);$("dn").onclick=()=>done(false);$("dy").focus()})}
function cls(st){const a=agg(st,null,null);if(a.n)return a.np?"np":(a.done-a.plan<-.05?"beh":"ok");return hsSum(st).n?"hs":"np"}
function staffStats(){const g={};S.forEach(x=>{const k=x.staffId||"";(g[k]=g[k]||[]).push(x)});STAFF.forEach(x=>{if(!g[x.id])g[x.id]=[]});
  return Object.keys(g).map(k=>{const L=g[k],m=STAFF.find(x=>x.id===k),c={beh:0,ok:0,np:0,hs:0};L.forEach(x=>c[cls(x)]++);
    const pct=L.length?Math.round(L.reduce((n,x)=>{const a=agg(x,null,null);return n+(a.total?a.done/a.total:0)},0)/L.length*100):0;
    const totalPrice=L.reduce((sum,x)=>sum+(+x.price||0),0);
    return{id:k,name:m?m.name:(k?(L[0]&&L[0].staffName)||"(ไม่ทราบชื่อ)":"ไม่ระบุพนักงาน"),joined:m?m.joined:"",seen:m?m.seen:"",n:L.length,beh:c.beh,ok:c.ok,np:c.np,hs:c.hs,pct,totalPrice}}).sort((a,b)=>a.name.localeCompare(b.name,"th"))}

async function api(a,p){const url=apiUrl();if(!url)throw new Error("no api url");
  let r;try{r=await fetch(url,{method:"POST",redirect:"follow",body:JSON.stringify(Object.assign({a,t:TOKEN},p||{}))})}catch(e){throw new Error("network")}
  let j;try{j=await r.json()}catch(e){throw new Error("bad response")}
  if(!j.ok)throw new Error(j.error||"error");return j.data}
const AUTHERR=/unauthorized|expired|disabled/;
function errTxt(e){const m=String(e&&e.message||e);return m==="invalid"?"รหัสไม่ถูกต้อง":m==="locked"?"ลองผิดหลายครั้ง ระบบล็อกชั่วคราว รอ 10 นาที":m==="network"?"เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ กดปุ่ม ทดสอบการเชื่อมต่อ ด้านล่างเพื่อตรวจ":m==="forbidden"?"ไม่มีสิทธิ์ทำรายการนี้":m==="limit"?"เพิ่ม Sub user ครบจำนวนที่กำหนดแล้ว":m}

async function enter(m){ME={id:m.id,owner:m.role==="main",reg:true,name:m.name,joined:""};mode="shared";hv=ME.owner?"all":"mine";sf="";

  const ids=new Set(r.ids),b=S.length;S=S.filter(o=>ids.has(o.id)||PEND[o.id]>0);if(S.length!==b)ch=true;return ch}

/* calc */
const tdates=(p,t)=>t===1?{start:p.ustart||p.start,end:p.uend||p.end}:{start:p.start,end:p.end};
function tspans(st){const o=[];SUBJ.forEach(s=>{const p=st.subj[s];if(!p.on)return;[0,1].forEach(t=>{if(p.t[t]){const d=tdates(p,t);o.push({s,t,start:d.start,end:d.end})}})});return o}
function frac(p,t){const d=tdates(p,t||0);if(!d.start||!d.end||!(D0(d.end)>D0(d.start)))return null;return Math.max(0,Math.min(1,(D0(TODAY)-D0(d.start))/(D0(d.end)-D0(d.start))))}
function agg(st,s,t){let total=0,done=0,plan=0,n=0,np=false;
  SUBJ.forEach(sj=>{if(s!=null&&sj!==s)return;const p=st.subj[sj];if(!p.on)return;
    C.forEach(x=>{if(x.s!==sj||(t!=null&&x.t!==t)||!p.t[x.t])return;const f=frac(p,x.t);total+=x.h;done+=Math.min(x.h,st.w[x.c]||0);plan+=x.h*(f||0);n++;if(f==null)np=true})});
  return{total,done,plan,n,np}}
function chip(a){if(!a.n)return'<span class="chip wait">–</span>';if(a.np)return'<span class="chip wait">ยังไม่ตั้งแผน</span>';
  const g=a.done-a.plan;if(a.plan<.05&&a.done<.05)return'<span class="chip wait">ยังไม่ถึงกำหนด</span>';
  if(Math.abs(g)<.05)return'<span class="chip ok">ตามแผน</span>';
  return g>0?`<span class="chip ok">ล้ำหน้า +\${fh(g)} ชม.</span>`:`<span class="chip bad">ล่าช้า \${fh(-g)} ชม.</span>`}
function due(st){let b=null;tspans(st).forEach(z=>{if(!z.end)return;const a=agg(st,z.s,z.t);if(!a.n||a.total-a.done<.05)return;
  const d=Math.round((D0(z.end)-D0(TODAY))/864e5);if(!b||d<b.d)b={d,s:z.s+" ("+TR[z.t]+")",r:Math.max(0,a.total-a.done)}});return b}
function dueTxt(st){const b=due(st);if(!b)return"–";return b.d<0?`<span class="chip bad">เลยกำหนด \${-b.d} วัน</span><div class="src">${b.s} · เหลือ ${fh(b.r)} ชม.</div>`:`อีก \${b.d} วัน<div class="src">${b.s} · เหลือ ${fh(b.r)} ชม.</div>`}

const mon=s=>{const d=D0(s),k=(d.getDay()+6)%7;d.setDate(d.getDate()-k);return iso(d)};
const addDays=(s,n)=>{const d=D0(s);d.setDate(d.getDate()+n);return iso(d)};
function weeks(st){const E=tspans(st).filter(x=>x.start);if(!E.length)return[];
  const a=E.map(x=>x.start).sort()[0],ends=tspans(st).map(x=>x.end).filter(Boolean).sort(),cw=mon(TODAY);
  const last=ends.length&&ends[ends.length-1]>cw?mon(ends[ends.length-1]):cw;
  let w=mon(a);const out=[];while(w<=last&&out.length<80){out.push(w);w=addDays(w,7)}return out}
function wauto(st,s,w){const p=st.subj[s];if(!p.on)return 0;let r=0;
  [0,1].forEach(t=>{if(!p.t[t])return;const d=tdates(p,t);if(!d.start||!d.end||!(D0(d.end)>D0(d.start)))return;
    const a=Math.max(D0(w),D0(d.start)),b=Math.min(D0(addDays(w,7)),D0(d.end)),dy=Math.max(0,(b-a)/864e5);
    r+=agg(st,s,t).total*dy/((D0(d.end)-D0(d.start))/864e5)});return r}
function wplan(st,s,w){const o=(st.wp||{})[w];if(st.subj[s].on&&o&&o[s]!==undefined)return o[s];return wauto(st,s,w)}
const wact=(st,s,w)=>((st.wk||{})[w]||{})[s]||0;
function wtot(st,w){let a=0,p=0;SUBJ.forEach(s=>{if(!st.subj[s].on)return;a+=wact(st,s,w);p+=wplan(st,s,w)});return{a,p}}
function wchip(a,p,isCur){if(p<.05&&a<.05)return'<span class="chip wait">–</span>';
  if(a>=p-.05)return`<span class="chip ok">\${a>p+.05?"เกินแผน +"+fh(a-p)+" ชม.":"ครบตามแผน"}</span>`;
  return isCur?`<span class="chip wait">ยังขาด \${fh(p-a)} ชม.</span>`:`<span class="chip bad">ขาด \${fh(p-a)} ชม.</span>`}

function cdInfo(st,s,t){const p=st.subj[s],a=agg(st,s,t);if(!p.on||!a.n)return null;const d=tdates(p,t);
  return{s,t,p,d,a,rem:Math.max(0,a.total-a.done),days:d.end?Math.round((D0(d.end)-D0(TODAY))/864e5):null,fin:a.total-a.done<.05}}

/* export */
const r1=v=>Math.round(v*10)/10;
async function dlSave(name,data){try{const type=/\.pdf$/i.test(name)?"application/pdf":/\.jpe?g$/i.test(name)?"image/jpeg":"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);toast("ดาวน์โหลดแล้ว: "+name)}catch(e){toast("ดาวน์โหลดไม่สำเร็จ")}}
function stTxt(a){if(!a.n)return"–";if(a.np)return"ยังไม่ตั้งแผน";const g=a.done-a.plan;if(a.plan<.05&&a.done<.05)return"ยังไม่ถึงกำหนด";if(Math.abs(g)<.05)return"ตามแผน";return g>0?"ล้ำหน้า +"+fh(g)+" ชม.":"ล่าช้า "+fh(-g)+" ชม."}

/* 🎯 สร้าง workbook โดยแบ่ง Sheet รายสัปดาห์ รายบุคคล ทั้ง TCAS และ ม.ปลาย */
function wbAllList(studentList){
  const wb=XLSX.utils.book_new(),add=(n,rows)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),n);
  
  // 1. ภาพรวมนักเรียน
  add("ภาพรวมนักเรียน",[["ชื่อ","สกุล","ชื่อเล่น","รหัส ONDY","เบอร์โทร","โรงเรียน","รุ่น TCAS","มหาวิทยาลัยเป้าหมาย","คณะ","ราคาคอร์ส (บาท)","ชั่วโมงทั้งหมด","เรียนแล้ว (ชม.)","เรียนแล้ว (%)","ตามแผน ณ วันนี้ (ชม.)","สถานะ","พนักงานดูแล"],
    ...studentList.map(t=>{const a=agg(t,null,null);return[t.first,t.last,t.nick,t.ondy,t.phone,t.school,t.batch,t.uni,t.faculty,t.price?+t.price:0,r1(a.total),r1(a.done),a.total?Math.round(a.done/a.total*100):0,r1(a.plan),stTxt(a),sn(t)]})]);
  
  // 2. หน้ารายสัปดาห์ TCAS แบ่งเป็นรายบุคคล
  studentList.forEach(st=>{
    const E=SUBJ.filter(s=>st.subj[s].on);
    if(E.length){
      const name = (st.nick || st.first || "นักเรียน").slice(0, 20);
      const rows = [["สัปดาห์เริ่ม","สัปดาห์สิ้นสุด",...E.flatMap(j=>[j+" แผน",j+" จริง"]),"รวมแผน","รวมจริง","สถานะ"],
        ...weeks(st).map(w=>{const t=wtot(st,w),g=t.a-t.p;return[w,addDays(w,6),...E.flatMap(j=>[r1(wplan(st,j,w)),r1(wact(st,j,w))]),r1(t.p),r1(t.a),g>=-.05?"ครบตามแผน":"ขาด "+fh(-g)+" ชม."]})];
      add(`TCAS-\${name}`, rows);
    }
  });

  // 3. หน้ารายสัปดาห์ ม.ปลาย แบ่งเป็นรายบุคคล
  studentList.forEach(st=>{
    const E2=hsubs(st);
    if(E2.length){
      const name = (st.nick || st.first || "นักเรียน").slice(0, 20);
      const rows = [["สัปดาห์เริ่ม","สัปดาห์สิ้นสุด",...E2.flatMap(j=>[j+" แผน",j+" จริง"]),"รวมแผน","รวมจริง","สถานะ"],
        ...hweeks(st).map(w=>{const t=hwtot(st,w),g=t.a-t.p;return[w,addDays(w,6),...E2.flatMap(j=>[r1(hwplan(st,j,w)),r1(hwact(st,j,w))]),r1(t.p),r1(t.a),g>=-.05?"ครบตามแผน":"ขาด "+fh(-g)+" ชม."]})];
      add(`ม.ปลาย-\${name}`, rows);
    }
  });

  return wb;
}

function rpSt(a){if(!a.n)return"–";if(a.np)return'<span class="y">ยังไม่ตั้งแผน</span>';const g=a.done-a.plan;if(a.plan<.05&&a.done<.05)return'<span class="y">ยังไม่ถึงกำหนด</span>';if(Math.abs(g)<.05)return'<span class="g">ตามแผน</span>';return g>0?`<span class="g">ล้ำหน้า +\${fh(g)} ชม.</span>`:`<span class="r">ล่าช้า \${fh(-g)} ชม.</span>`}

function buildPages(st){
  const E=SUBJ.filter(x=>st.subj[x].on),cw=mon(TODAY),a=agg(st,null,null),pct=a.total?Math.round(a.done/a.total*100):0,tw=wtot(st,cw),g=a.done-a.plan;
  const W=weeks(st).filter(w=>w<=cw).reverse();
  const row=w=>{const t=wtot(st,w);return`<tr><td>\${fd(w)} – ${fd(addDays(w,6))}</td>${E.map(j=>`<td>${fh(wact(st,j,w))} / ${fh(wplan(st,j,w))}</td>`).join("")}<td><b>\${fh(t.a)}</b></td><td>${fh(t.p)}</td><td>${rpW(t,w===cw)}</td></tr>`};
  const th=`<table><thead><tr><th>สัปดาห์</th>\${E.map(j=>`<th>${j}<br>จริง / แผน</th>`).join("")}<th>รวมจริง</th><th>รวมแผน</th><th>สถานะ</th></tr></thead><tbody>`;
  const ft=`<div class="ft"><span>${esc(nm(st))} · ออกรายงาน ${fd(TODAY)}</span><span>หน้า {{n}}</span></div>`;
  const subj=tspans(st).map(z=>{const x=cdInfo(st,z.s,z.t);if(!x)return"";return`<tr><td>\${z.s} · ${TR[z.t]}</td><td>${fd(x.d.start)}</td><td>${fd(x.d.end)}</td><td>${x.fin?"ครบแล้ว":x.days==null?"–":x.days<0?"เลย "+(-x.days):x.days}</td><td>${fh(x.a.done)} /${fh(x.a.total)}</td><td>${fh(x.rem)}</td><td>${rpSt(x.a)}</td></tr>`}).join("");
  const first=W.slice(0,10),rest=[];for(let i=10;i<W.length;i+=36)rest.push(W.slice(i,i+36));
  const p1=`<div style="display:flex;justify-content:space-between;align-items:flex-start"><div><h1>รายงานผลความคืบหน้าการเรียน</h1><div style="color:#5d6b82">คอร์ส TCAS + UpSkill A-Level · ออกรายงาน ${fd(TODAY)}</div></div>${st.photo?`<img src="${st.photo}" style="width:68px;height:68px;border-radius:8px">`:""}</div>
  <div class="kv"><span><b>นักเรียน:</b> ${esc(nm(st))\vert{}\vert{}"–"}</span><span><b>พนักงานดูแล:</b> ${esc(sn(st))}</span><span><b>รหัส ONDY:</b> ${esc(st.ondy)\vert{}\vert{}"–"}</span><span><b>โรงเรียน:</b> ${esc(st.school)||"–"}</span><span><b>รุ่น:</b> ${esc(st.batch)\vert{}\vert{}"–"}</span><span><b>เบอร์โทร:</b> ${esc(st.phone)||"–"}</span><span><b>เป้าหมาย:</b> ${esc(st.faculty)\vert{}\vert{}"–"} ${st.uni?"· "+esc(st.uni):""}</span></div>
  <div class="box"><div class="bx"><b>\${fh(a.done)} / ${fh(a.total)} ชม.</b>เรียนแล้ว ${pct}%</div><div class="bx"><b>\${fh(a.plan)} ชม.</b>ควรเรียนตามแผน ณ วันนี้</div><div class="bx"><b>${a.np\vert{}\vert{}!a.n?"–":(g>=0?"+":"−")+fh(Math.abs(g))+" ชม."}</b>${stTxt(a)}</div><div class="bx"><b>${fh(tw.a)} /${fh(tw.p)} ชม.</b>สัปดาห์นี้ จริง / แผน</div></div>
  <h2>สรุปรายวิชา</h2><table><thead><tr><th>วิชา</th><th>วันเริ่ม</th><th>วันที่ต้องจบ</th><th>เหลือ (วัน)</th><th>เรียนแล้ว / ทั้งหมด (ชม.)</th><th>เหลือ (ชม.)</th><th>สถานะ</th></tr></thead><tbody>\${subj}</tbody></table>
  <h2>ชั่วโมงเรียนรายสัปดาห์: แผน (เทา) vs เรียนจริง (เขียวน้ำเงิน)</h2>\${weekSvg(st,true)}
  <h2>รายละเอียดรายสัปดาห์</h2>${first.length?th+first.map(row).join("")+"</tbody></table>":"<p>ยังไม่มีสัปดาห์ที่ต้องรายงาน</p>"}${ft}`;
  return[p1,...rest.map(r=>`<h2>รายละเอียดรายสัปดาห์ (ต่อ)</h2>\${th}${r.map(row).join("")}</tbody></table>${ft}`),...(hsPage(st)?[hsPage(st)]:[])]}
async function makePdf(st){
  if(!window.html2canvas||!window.jspdf)throw{code:"โหลดไลบรารี PDF ไม่สำเร็จ"};
  try{await Promise.all([document.fonts.load('400 12px "IBM Plex Sans Thai"'),document.fonts.load('600 12px "IBM Plex Sans Thai"')])}catch(e){}
  const pages=buildPages(st),pdf=new window.jspdf.jsPDF({unit:"pt",format:"a4",compress:true}),pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight();
  for(let i=0;i<pages.length;i++){const d=document.createElement("div");d.className="rp";d.id="rpcur";d.innerHTML=pages[i].replace("{{n}}",(i+1)+"/"+pages.length);document.body.appendChild(d);
    let cv;try{cv=await html2canvas(d,{scale:2,backgroundColor:"#ffffff",logging:false,scrollX:0,scrollY:0,onclone:doc=>{const e=doc.getElementById("rpcur");e.style.left="0px";e.style.top="0px"}})}finally{d.remove()}
    if(i)pdf.addPage();pdf.addImage(cv.toDataURL("image/jpeg",.92),"JPEG",0,0,pw,ph)}
  return pdf.output("arraybuffer")}

const fname=st=>(st.first||"นักเรียน")+(st.last?"-"+st.last:"");

/* views */
function render(){
  updMsg();
  {const mn=document.getElementById("myname");if(!(mn&&document.activeElement===mn))$("who").innerHTML=whoHtml()}
  const st=S.find(s=>s.id===cur);
  $("home").hidden=!!st;$("detail").hidden=!st;
  if(st){const ob=$("cwb"),oh=$("hcwb"),keep=ob&&lastId===cur?ob.scrollTop:null,keepH=oh&&lastId===cur?oh.scrollTop:null,keepC=($("cnbox")&&lastId===cur)?$("cnbox").scrollTop:null;lastId=cur;$("detail").innerHTML=detailHtml(st);charts(st);weekChart(st);hsChart(st);{const e=$("hcw");if(e)e.innerHTML=weekSvg(st,false,hweeks,hwtot)}const nb=$("cwb"),rw=$("cwrow");if(nb){if(keep!=null)nb.scrollTop=keep;else if(rw)nb.scrollTop=Math.max(0,rw.offsetTop-nb.clientHeight/2)}{const nc=$("cnbox");if(nc&&keepC!=null)nc.scrollTop=keepC}const nh=$("hcwb"),hr=$("hcwrow");if(nh){if(keepH!=null)nh.scrollTop=keepH;else if(hr)nh.scrollTop=Math.max(0,hr.offsetTop-nh.clientHeight/2)}}else{cur=null;home()}
  const ro=readOnly||(st&&!canEdit(st));
  if(ro)document.querySelectorAll("#detail input,#detail select,#detail textarea,#detail .act").forEach(e=>e.disabled=true);
  if(!st&&!canAdd())document.querySelectorAll("#home .act").forEach(e=>e.disabled=true)}

function home(){
  const sh=mode==="shared",V=visible(),rows=V.map(x=>({s:x,c:cls(x)})),n=c=>rows.filter(r=>r.c===c).length,nMine=S.filter(x=>x.staffId===ME.id).length;
  const totalPriceSum = V.reduce((sum, x) => sum + (+x.price || 0), 0);
  
  const tabs=sh&&ME.owner?`<div class="tabs"><button data-hv="mine" class="${hv==="mine"?"on":""}">🙋 นักเรียนของฉัน (${nMine})</button><button data-hv="all" class="\${hv==="all"?"on":""}">👥 นักเรียนทั้งหมด (${S.length})</button>${ME.owner?`<button data-hv="staff" class="${hv==="staff"?"on":""}">🧑‍💼 Sub user ทั้งหมด (${staffStats().filter(t=>t.id!=="main"&&t.id!=="").length})</button>`:""}</div>`:"";
  const head=`<h1>🎓 ติดตามนักเรียนที่สมัครคอร์ส</h1><p class="sub">ผู้ดูแลกรอกข้อมูลนักเรียน วันสมัคร วันเริ่ม และวันที่ต้องจบรายวิชา แล้วติดตามความคืบหน้าเทียบแผน</p>\${tabs}`;
  
  // 🎯 Main user ดู Sub user เป็น Dashboard Card
  if(sh&&hv==="staff"&&ME.owner){$("home").innerHTML=head+`<section class="panel"><h2>🧑‍🏫 Dashboard รายบุคคล Sub user</h2>\${staffCards()}</section>`;return}
  
  const fl=sf!==""?`<span class="chip wait">กรองพนักงาน: \${esc(sf==="-"?"ไม่ระบุ":sname(sf)||"ไม่ทราบชื่อ")} <button class="sm" data-sf="">ล้างตัวกรอง</button></span>`:"";
  $("home").innerHTML=head+`<div class="stats">
    <div class="stat hero"><b>${V.length}</b><span>นักเรียน${hv==="mine"&&sh?"ของฉัน":"ทั้งหมด"}</span></div>
    <div class="stat"><b style="color:var(--ok)">฿\${totalPriceSum.toLocaleString()}</b><span>สรุปยอดขายรวมทั้งแผน</span></div>
    <div class="stat"><b style="color:var(--bad)">\${n("beh")}</b><span>ล่าช้ากว่าแผน</span></div>
    <div class="stat"><b style="color:var(--ok)">\${n("ok")}</b><span>ตามแผนหรือล้ำหน้า</span></div>
  </div>
  <div class="tb">
    <input id="q" type="search" placeholder="ค้นหา ชื่อ ชื่อเล่น เบอร์ รหัส ONDY รุ่น คณะ มหาวิทยาลัย พนักงาน" value="\${esc(q)}" aria-label="ค้นหานักเรียน">
    <button class="primary act" id="add">+ เพิ่มนักเรียน</button>
    <button id="gsheetAll">📗 สร้าง Google Sheet ใน Drive ของฉัน</button>
  </div>\${fl}
  <section class="panel"><div class="scroll" id="tbl"></div></section>`;
  table()}

function table(){
  const t=q.trim().toLowerCase(),sh=mode==="shared";
  const rows=visible().map(x=>({s:x,a:agg(x,null,null)})).filter(r=>!t||[r.s.first,r.s.last,r.s.nick,r.s.phone,r.s.ondy,r.s.school,r.s.batch,r.s.uni,r.s.faculty,sn(r.s)].join(" ").toLowerCase().includes(t))
    .sort((x,y)=>{const g=r=>r.a.n&&!r.a.np?r.a.done-r.a.plan:1e9;return g(x)-g(y)});
  $("tbl").innerHTML=rows.length?`<table style="min-width:${sh?1100:980}px"><thead><tr><th>ชื่อ-สกุล</th>${sh?"<th>พนักงานดูแล</th>":""}<th>ยอดขาย</th><th>รุ่น</th><th>เป้าหมาย</th><th>เนื้อหาแข่งขัน</th><th>แผน vs จริง</th><th>ครบกำหนดใกล้สุด</th><th>รายงาน</th></tr></thead><tbody>`+rows.map(({s,a})=>{
    const p=a.total?Math.round(a.done/a.total*100):0;
    const alertTag = needsAlert(s) ? `<span class="alert-badge">🔔 ต้องติดตาม</span>` : ``;
    return`<tr class="rw"><td><div class="nmc">${av(s,36)}<div><button class="lnk" data-open="${s.id}">${esc(nm(s))||"(ยังไม่ใส่ชื่อ)"}</button>${alertTag}<div class="src">${s.ondy?esc(s.ondy)+" · ":""}${esc(s.phone)}${s.school?" · "+esc(s.school):""}</div></div></div></td>${sh?`<td>\${esc(sn(s))}</td>`:""}<td>฿${(+s.price||0).toLocaleString()}</td><td>${esc(s.batch)}</td><td>${esc(s.faculty)||"–"}<div class="src">${esc(s.uni)}</div></td>
    <td>${a.n?`\${fh(a.done)}/${fh(a.total)} ชม. (${p}%)<div class="bar"><i style="width:\${p}%"></i></div>`:"–"}</td><td>${chip(a)}</td><td>${dueTxt(s)}</td><td><button class="sm" data-pdf="${s.id}">รายงาน PDF</button><button class="sm" data-tt="${s.id}:pdf">ตารางแผน PDF</button><button class="sm" data-tt="${s.id}:jpg">ตารางแผน JPG</button></td></tr>`}).join("")+`</tbody></table>`:`<p class="sub" style="margin:0">${S.length?"ไม่พบนักเรียนที่ค้นหา":"🌱 ยังไม่มีนักเรียน กด + เพิ่มนักเรียน เพื่อเริ่มติดตาม"}</p>`}

function detailHtml(st){
  const F=(k,l,type="text",ph="")=>`<div><label class="l" for="f_${k}">${l}</label><input id="f_${k}" type="${type}" data-f="${k}" value="${esc(st[k])}" placeholder="${ph}"${k==="batch"?' list="bl"':""}></div>`;
  
  let h=`<div class="tb"><button id="back">← กลับไปรายชื่อ</button><button id="pdf" class="primary">ดาวน์โหลดรายงาน PDF</button><button id="ttpdf">📅 ตารางแผน PDF</button><button id="ttjpg">🖼️ ตารางแผน JPG</button><button id="gsheet">📗 สร้าง Google Sheet ใน Drive ของฉัน</button><span style="flex:1"></span><button id="del" class="act">ลบนักเรียนคนนี้</button></div>
  <div class="nmc" style="margin-bottom:16px">${av(st,60)}<div><h1>${esc(nm(st))||"นักเรียนใหม่"}${needsAlert(st)?'<span class="alert-badge" style="font-size:0.9rem">🔔 สัปดาห์นี้ต้องได้รับการติดตาม</span>':''}</h1><p class="sub" style="margin:0">${esc(st.batch)}${st.faculty?" · "+esc(st.faculty):""}${st.uni?" · "+esc(st.uni):""}${mode==="shared"?" · ดูแลโดย "+esc(sn(st)):""}</p></div></div>
  ${noteHtml(st)}<section class="panel"><h2>🧸 ข้อมูลนักเรียน</h2><div class="prof"><div class="ph">${av(st,110)}<label class="btnl">${st.photo?"เปลี่ยนรูป":"อัปโหลดรูป"}<input id="pf" type="file" accept="image/*" hidden></label>${st.photo?'<button id="prm" class="act">ลบรูป</button>':""}</div><div class="fg f" style="flex:1;min-width:260px">${F("first","ชื่อ")}${F("last","สกุล")}${F("nick","ชื่อเล่น")}${F("ondy","รหัส ONDY นักเรียน","text","เช่น ONDY12345")}${staffField(st)}${F("phone","เบอร์โทร","tel")}${F("school","ชื่อโรงเรียน")}<div><label class="l" for="f_batch">รุ่นระบบ TCAS</label><select id="f_batch" data-f="batch">${["",...(st.batch&&!BATCHES.includes(st.batch)?[st.batch]:[]),...BATCHES].map(b=>`<option value="\${esc(b)}"${b===(st.batch\vert{}\vert{}"")?" selected":""}>${b?esc(b):"เลือกรุ่น"}</option>`).join("")}</select></div>${F("uni","มหาวิทยาลัยเป้าหมาย")}${F("faculty","คณะที่อยากสอบติด")}
  ${F("price","ราคาคอร์ส (หลังหักส่วนลดแล้ว) - บาท","number","เช่น 15000")}
  <div class="full"><label class="l" for="f_note">หมายเหตุ</label><textarea id="f_note" data-f="note">${esc(st.note)}</textarea></div></div></div></section>`;
  return h;
}

/* events */
function addStudent(s){if(mode==="shared"&&!ME.id){toast("บัญชีนี้บันทึกข้อมูลไม่ได้");return}if(!canAdd()){toast("ใส่ชื่อของคุณก่อนจึงจะเพิ่มนักเรียนได้");return}s.staffId=ME.id||"";s.staffName=ME.name||(ME.owner?"เจ้าของระบบ":"");S.push(s);save(s,true);cur=s.id;render()}
document.addEventListener("click",e=>{const el=e.target.closest("button");if(!el)return;
  if(el.dataset.open){cur=el.dataset.open;const x=S.find(o=>o.id===cur);tab="comp";lastId=null;render();window.scrollTo(0,0)}
  else if(el.id==="doLogin")doLogin()
  else if(el.id==="doTest")testConn()
  else if(el.id==="urlchg"){$("urlbox").hidden=false;$("urlchg").hidden=true}
  else if(el.id==="shareLink")shareLink()
  else if(el.id==="logout")logout()
  else if(el.id==="refresh"){pull(false).then(()=>{render();toast("อัปเดตข้อมูลแล้ว")}).catch(e=>fail(e))}
  else if(el.id==="addsub"){const n=(\$("newsub").value||"").trim();if(!n){toast("ใส่ชื่อ Sub user ก่อน");return}
    api("addUser",{name:n}).then(r=>{showCode(r.name,r.code);return loadUsers()}).then(()=>render()).catch(e=>fail(e,"เพิ่ม Sub user ไม่สำเร็จ"))}
  else if(el.dataset.du){const id=el.dataset.du,u=USERS.find(x=>x.id===id);ask("ยืนยันลบ Sub user '"+(u?u.name:"")+"' ออกจากระบบ?").then(ok=>{if(ok)api("delUser",{id}).then(()=>loadUsers()).then(()=>{render();toast("ลบ Sub user แล้ว")}).catch(e=>fail(e))})}
  else if(el.dataset.ru){const id=el.dataset.ru,u=USERS.find(x=>x.id===id);ask("ออกรหัสใหม่ให้ "+(u?u.name:"")+"?").then(ok=>{if(ok)api("userSet",{id,reset:true}).then(r=>showCode(r.name,r.code)).catch(e=>fail(e))})}
  else if(el.dataset.tu){const id=el.dataset.tu,u=USERS.find(x=>x.id===id);if(u)api("userSet",{id,active:!u.active}).then(()=>loadUsers()).then(()=>{render();toast(u.active?"ปิดใช้งานแล้ว":"เปิดใช้งานแล้ว")}).catch(e=>fail(e))}
  else if(el.dataset.nu){const id=el.dataset.nu,u=USERS.find(x=>x.id===id);askText("ชื่อใหม่ของ Sub user",u?u.name:"").then(v=>{if(v)api("userSet",{id,name:v}).then(()=>loadUsers()).then(()=>render()).catch(e=>fail(e))})}
  else if(el.id==="gsheet"){const st=S.find(x=>x.id===cur);if(st)mkSheet(wbAllList([st]),"รายงาน "+fname(st)+" "+TODAY)}
  else if(el.id==="gsheetAll"){if(!S.length){toast("ยังไม่มีนักเรียนให้สร้างรายงาน");return}mkSheet(wbAllList(visible()),"ภาพรวมนักเรียน "+TODAY)}
  else if(el.dataset.hv){hv=el.dataset.hv;sf="";render()}
  else if(el.dataset.sf!==undefined){sf=el.dataset.sf;hv="all";render()}
  else if(el.dataset.pdf)doPdf(S.find(x=>x.id===el.dataset.pdf))
  else if(el.id==="add")addStudent(blank());
  else if(el.id==="back"){cur=null;render()}
  else if(el.id==="del"){const st=S.find(s=>s.id===cur);if(st&&canEdit(st))ask("ลบ "+(nm(st)||"นักเรียนคนนี้")+" ออกจากระบบถาวร?").then(ok=>{if(ok){removeS(st.id);cur=null;render()}})}
});

document.addEventListener("input",e=>{const el=e.target;
  if(el.id==="q"){q=el.value;table();return}
  const st=S.find(s=>s.id===cur);if(!st||!el.dataset.f||el.tagName==="SELECT")return;st[el.dataset.f]=el.value;typing=true;save(st,false);
});

document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target&&e.target.id==="code")doLogin()});
init();
</script>
