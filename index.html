<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TCAS Tracker</title>
<meta name="theme-color" content="#0b7f86">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1626;--surface:#162135;--ink:#e8eef8;--muted:#9aa9c2;--line:#2a3854;--accent:#45c3ca;--accent-soft:#12363a;--ok:#5fd397;--ok-soft:#14352a;--warn:#f0c14b;--warn-soft:#3b3014;--bad:#f07a98;--bad-soft:#401b28;--sh:0 8px 24px rgba(0,0,0,.25)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 "Prompt","IBM Plex Sans Thai",sans-serif}
main{max-width:1080px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.5rem;margin:0 0 4px}h2{font-size:1.1rem;margin:0 0 10px}
.sub{color:var(--muted);margin:0 0 16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:var(--sh)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--sh)}
.stat b{display:block;font-size:1.6rem;line-height:1.2}.stat span{color:var(--muted);font-size:.85rem}
.stat.hero{background:var(--accent-soft);border-color:var(--accent)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:600px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);font-size:.92rem}
th{color:var(--muted);font-weight:500;font-size:.82rem}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.8rem;font-weight:500;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.wait{background:var(--warn-soft);color:var(--warn)}
.alert-badge{background:var(--bad-soft);color:var(--bad);padding:2px 8px;border-radius:12px;font-size:.78rem;font-weight:600;display:inline-flex;align-items:center;gap:4px;margin-left:6px;animation:pulse 2s infinite}
@keyframes pulse { 0% { opacity: 0.8; } 50% { opacity: 1; transform: scale(1.03); } 100% { opacity: 0.8; } }
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 16px;border-radius:999px;transition:all .15s}
button.primary{background:var(--accent);color:#0e1626;border-color:var(--accent);font-weight:600}
button:disabled{opacity:0.5;cursor:not-allowed}
.f input,.f select,.f textarea{width:100%;font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.tb{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 12px}.tb input{flex:1;min-width:200px;font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
.tabs{display:flex;gap:8px;margin:0 0 16px;flex-wrap:wrap}.tabs button{padding:8px 16px}.tabs button.on{background:var(--accent);color:#0e1626;border-color:var(--accent);font-weight:600}
[hidden]{display:none!important}
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:40;padding:16px}
.lbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:24px;width:100%;max-width:400px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:.9rem;z-index:50}
#toast:empty{display:none}
.user-card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:12px}
.user-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--sh)}
.user-card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.user-card-body{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.user-card-stat{background:var(--bg);padding:8px 12px;border-radius:8px;font-size:.85rem}
.user-card-stat b{display:block;font-size:1.2rem;color:var(--ink)}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.lnk{border:none;background:none;padding:0;font-weight:600;color:var(--accent);text-align:left;cursor:pointer}
</style>
</head>
<body>
<main>
<div id="login">
  <div class="lbox">
    <h1>🎓 TCAS Tracker</h1>
    <p class="sub">เข้าสู่ระบบด้วยรหัสผู้ใช้ (Main user หรือ Sub user)</p>
    <div class="f" style="margin-bottom:12px">
      <label for="apiurl" style="font-size:.85rem;color:var(--muted)">Web app URL (ตั้งครั้งเดียว)</label>
      <input id="apiurl" placeholder="https://script.google.com/macros/s/…/exec">
    </div>
    <div class="f" style="margin-bottom:16px">
      <label for="code" style="font-size:.85rem;color:var(--muted)">รหัสผู้ใช้</label>
      <input id="code" type="password" placeholder="รหัสที่ได้รับ">
    </div>
    <button class="primary" id="doLogin" style="width:100%">เข้าสู่ระบบ</button>
    <p id="lerr" style="margin:10px 0 0;font-size:.85rem;color:var(--bad)"></p>
  </div>
</div>

<div id="toast"></div>
<div id="who" style="margin-bottom:12px;font-size:.9rem;color:var(--muted)"></div>
<div id="home" hidden></div>
<div id="detail" hidden></div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
var API_URL = localStorage.getItem("tcas-api") || "";
var TOKEN = localStorage.getItem("tcas-token") || "";
var ME = null;
var STUDENTS = [];
var USERS = [];
var hv = "all";
var q = "";
var cur = null;

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;"); }

function toast(msg) {
  var t = $("toast");
  t.textContent = msg;
  setTimeout(function() { t.textContent = ""; }, 3000);
}

if (API_URL) $("apiurl").value = API_URL;

function api(action, params) {
  var url = $("apiurl").value.trim() || API_URL;
  if (!url) return Promise.reject(new Error("กรุณากรอก Web app URL"));
  
  var payload = Object.assign({ a: action, t: TOKEN }, params || {});
  return fetch(url, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  })
  .then(function(res) { return res.json(); })
  .then(function(json) {
    if (!json.ok) throw new Error(json.error || "เกิดข้อผิดพลาด");
    return json.data;
  });
}

$("doLogin").onclick = function() {
  var btn = $("doLogin");
  var url = $("apiurl").value.trim();
  var code = $("code").value.trim();
  $("lerr").textContent = "";

  if (!url) { $("lerr").textContent = "กรุณากรอก Web app URL"; return; }
  if (!code) { $("lerr").textContent = "กรุณากรอกรหัสผู้ใช้"; return; }

  btn.disabled = true;
  $("lerr").style.color = "var(--ink)";
  $("lerr").textContent = "กำลังเข้าสู่ระบบ...";
  
  localStorage.setItem("tcas-api", url);
  API_URL = url;

  api("login", { code: code })
    .then(function(data) {
      TOKEN = data.token;
      ME = data.me;
      localStorage.setItem("tcas-token", TOKEN);
      $("login").hidden = true;
      $("home").hidden = false;
      toast("เข้าสู่ระบบสำเร็จ");
      loadData();
    })
    .catch(function(err) {
      $("lerr").style.color = "var(--bad)";
      $("lerr").textContent = err.message === "invalid" ? "รหัสผู้ใช้ไม่ถูกต้อง" : err.message;
    })
    .then(function() { btn.disabled = false; });
};

function loadData() {
  api("list", { since: 0 })
    .then(function(data) {
      STUDENTS = data.students || [];
      if (ME.role === "main") {
        return api("users").then(function(uData) { USERS = uData.users || []; });
      }
    })
    .then(function() { renderHome(); })
    .catch(function(err) { toast("โหลดข้อมูลไม่สำเร็จ: " + err.message); });
}

function renderHome() {
  $("who").innerHTML = "ผู้ใช้งาน: <b>" + esc(ME.name) + "</b> (" + (ME.role === "main" ? "Main User" : "Sub User") + ") | <button onclick=\"logout()\" style=\"padding:2px 10px;font-size:.8rem\">ออกจากระบบ</button>";
  
  var totalPrice = STUDENTS.reduce(function(sum, s) { return sum + (+s.price || 0); }, 0);
  
  var tabs = ME.role === "main" ? 
    "<div class=\"tabs\">" +
      "<button class=\"" + (hv === "all" ? "on" : "") + "\" onclick=\"switchTab('all')\">👥 นักเรียนทั้งหมด (" + STUDENTS.length + ")</button>" +
      "<button class=\"" + (hv === "staff" ? "on" : "") + "\" onclick=\"switchTab('staff')\">🧑‍💼 Sub user ทั้งหมด (" + USERS.length + ")</button>" +
    "</div>" : "";

  if (ME.role === "main" && hv === "staff") {
    renderStaffTab(tabs);
    return;
  }

  $("home").innerHTML = 
    "<h1>🎓 ติดตามนักเรียนที่สมัครคอร์ส</h1>" + tabs +
    "<div class=\"stats\">" +
      "<div class=\"stat hero\"><b>" + STUDENTS.length + " คน</b><span>นักเรียนทั้งหมด</span></div>" +
      "<div class=\"stat\"><b style=\"color:var(--ok)\">฿" + totalPrice.toLocaleString() + "</b><span>สรุปยอดขายรวม</span></div>" +
    "</div>" +
    "<div class=\"panel\">" +
      "<div class=\"tb\">" +
        "<input id=\"q\" placeholder=\"ค้นหาชื่อนักเรียน...\" value=\"" + esc(q) + "\" oninput=\"filterTable()\">" +
        "<button class=\"primary\" onclick=\"addStudent()\">+ เพิ่มนักเรียน</button>" +
        "<button onclick=\"exportDriveSheet()\">📗 สร้าง Google Sheet ใน Drive ของฉัน</button>" +
      "</div>" +
      "<div class=\"scroll\">" +
        "<table>" +
          "<thead><tr><th>ชื่อ-สกุล</th><th>เบอร์โทร</th><th>รุ่น</th><th>ราคาคอร์ส (หลังหักส่วนลด)</th><th>การติดตาม</th><th>จัดการ</th></tr></thead>" +
          "<tbody id=\"stbody\">" + renderTableRows(STUDENTS) + "</tbody>" +
        "</table>" +
      "</div>" +
    "</div>";
}

function renderStaffTab(tabs) {
  var userCards = USERS.map(function(u) {
    var uStudents = STUDENTS.filter(function(s) { return s.staffId === u.id; });
    var uPrice = uStudents.reduce(function(sum, s) { return sum + (+s.price || 0); }, 0);
    return "<div class=\"user-card\">" +
      "<div class=\"user-card-head\">" +
        "<b>" + esc(u.name) + "</b>" +
        "<span class=\"chip " + (u.active ? "ok" : "bad") + "\">" + (u.active ? "เปิดใช้งาน" : "ปิดใช้งาน") + "</span>" +
      "</div>" +
      "<div class=\"user-card-body\">" +
        "<div class=\"user-card-stat\"><span>นักเรียน</span><b>" + uStudents.length + " คน</b></div>" +
        "<div class=\"user-card-stat\"><span>ยอดขาย</span><b style=\"color:var(--ok)\">฿" + uPrice.toLocaleString() + "</b></div>" +
      "</div>" +
      "<div style=\"display:flex;gap:6px\">" +
        "<button class=\"dng\" onclick=\"delSubUser('" + u.id + "')\" style=\"padding:4px 10px;font-size:.8rem;color:var(--bad)\">🗑️ ลบ Sub user</button>" +
      "</div>" +
    "</div>";
  }).join("");

  $("home").innerHTML = 
    "<h1>🎓 ติดตามนักเรียนที่สมัครคอร์ส</h1>" + tabs +
    "<div class=\"panel\">" +
      "<h2>🧑‍🏫 Dashboard รายบุคคล Sub User</h2>" +
      "<div style=\"margin-bottom:12px;display:flex;gap:8px\">" +
        "<input id=\"newSubName\" placeholder=\"ชื่อ Sub user ใหม่\" style=\"padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)\">" +
        "<button class=\"primary\" onclick=\"addSubUser()\">+ เพิ่ม Sub user</button>" +
      "</div>" +
      "<div class=\"user-card-grid\">" + (userCards || "<p class=\"sub\">ยังไม่มี Sub user ในระบบ</p>") + "</div>" +
    "</div>";
}

function switchTab(tab) {
  hv = tab;
  renderHome();
}

function renderTableRows(list) {
  if (!list.length) return "<tr><td colspan=\"6\" style=\"text-align:center;color:var(--muted)\">ยังไม่มีข้อมูลนักเรียน</td></tr>";
  return list.map(function(s) {
    return "<tr>" +
      "<td><button class=\"lnk\" onclick=\"editStudent('" + s.id + "')\"><b>" + esc(s.first) + " " + esc(s.last) + "</b> (" + esc(s.nick || "-") + ")</button></td>" +
      "<td>" + esc(s.phone || "-") + "</td>" +
      "<td>" + esc(s.batch || "-") + "</td>" +
      "<td>฿" + (+s.price || 0).toLocaleString() + "</td>" +
      "<td><span class=\"alert-badge\">🔔 ต้องติดตามสัปดาห์นี้</span></td>" +
      "<td><button onclick=\"editStudent('" + s.id + "')\" style=\"padding:3px 10px;font-size:.8rem\">ดู/แก้ไข</button></td>" +
    "</tr>";
  }).join("");
}

function filterTable() {
  q = $("q").value.toLowerCase();
  var filtered = STUDENTS.filter(function(s) {
    return (s.first + s.last + s.nick).toLowerCase().indexOf(q) !== -1;
  });
  $("stbody").innerHTML = renderTableRows(filtered);
}

function addStudent() {
  var first = prompt("กรอกชื่อนักเรียน:");
  if (!first) return;
  var newSt = { id: "s" + Date.now().toString(36), first: first, last: "", nick: "", price: 0, batch: "DEK71" };
  api("save", { s: newSt })
    .then(function() {
      STUDENTS.push(newSt);
      renderHome();
      toast("เพิ่มนักเรียนเรียบร้อย");
    })
    .catch(function(err) { toast("บันทึกไม่สำเร็จ: " + err.message); });
}

function addSubUser() {
  var name = $("newSubName").value.trim();
  if (!name) return toast("กรอกชื่อ Sub user ก่อน");
  api("addUser", { name: name })
    .then(function(res) {
      alert("สร้าง Sub user เรียบร้อย\nรหัสเข้าใช้งานคือ: " + res.code);
      loadData();
    })
    .catch(function(err) { toast("เพิ่มไม่สำเร็จ: " + err.message); });
}

function delSubUser(id) {
  if (!confirm("ยืนยันลบ Sub user คนนี้?")) return;
  api("delUser", { id: id })
    .then(function() {
      toast("ลบ Sub user เรียบร้อย");
      loadData();
    })
    .catch(function(err) { toast("ลบไม่สำเร็จ: " + err.message); });
}

function editStudent(id) {
  var s = STUDENTS.find(function(x) { return x.id === id; });
  if (!s) return;
  $("home").hidden = true;
  $("detail").hidden = false;
  
  $("detail").innerHTML = 
    "<button onclick=\"backToHome()\">← กลับหน้ารายชื่อ</button>" +
    "<div class=\"panel\" style=\"margin-top:12px\">" +
      "<h2>แก้ไขข้อมูล: " + esc(s.first) + "</h2>" +
      "<div class=\"fg f\">" +
        "<div><label>ชื่อ</label><input id=\"efirst\" value=\"" + esc(s.first) + "\"></div>" +
        "<div><label>นามสกุล</label><input id=\"elast\" value=\"" + esc(s.last) + "\"></div>" +
        "<div><label>ชื่อเล่น</label><input id=\"enick\" value=\"" + esc(s.nick) + "\"></div>" +
        "<div><label>เบอร์โทร</label><input id=\"ephone\" value=\"" + esc(s.phone) + "\"></div>" +
        "<div><label>รุ่น</label><input id=\"ebatch\" value=\"" + esc(s.batch) + "\"></div>" +
        "<div><label>ราคาคอร์ส (หลังหักส่วนลดแล้ว)</label><input id=\"eprice\" type=\"number\" value=\"" + (+s.price || 0) + "\"></div>" +
      "</div>" +
      "<div style=\"display:flex;gap:10px;margin-top:16px\">" +
        "<button class=\"primary\" onclick=\"saveEdit('" + s.id + "')\">บันทึกข้อมูล</button>" +
        "<button class=\"dng\" onclick=\"delStudent('" + s.id + "')\" style=\"color:var(--bad)\">🗑️ ลบนักเรียน</button>" +
      "</div>" +
    "</div>";
}

function saveEdit(id) {
  var s = STUDENTS.find(function(x) { return x.id === id; });
  if (!s) return;
  s.first = $("efirst").value;
  s.last = $("elast").value;
  s.nick = $("enick").value;
  s.phone = $("ephone").value;
  s.batch = $("ebatch").value;
  s.price = $("eprice").value;

  api("save", { s: s })
    .then(function() {
      toast("บันทึกข้อมูลแล้ว");
      backToHome();
    })
    .catch(function(err) { toast("เกิดข้อผิดพลาด: " + err.message); });
}

function delStudent(id) {
  if (!confirm("ยืนยันลบนักเรียนคนนี้ออกจากระบบ?")) return;
  api("del", { id: id })
    .then(function() {
      toast("ลบข้อมูลนักเรียนแล้ว");
      STUDENTS = STUDENTS.filter(function(x) { return x.id !== id; });
      backToHome();
    })
    .catch(function(err) { toast("ลบไม่สำเร็จ: " + err.message); });
}

function exportDriveSheet() {
  toast("กำลังสร้าง Google Sheet ใน Drive...");
  var sheets = [
    {
      name: "ภาพรวมนักเรียน",
      rows: [
        ["ชื่อ", "นามสกุล", "ชื่อเล่น", "เบอร์โทร", "รุ่น", "ราคาคอร์ส"],
        STUDENTS.map(function(s) { return [s.first, s.last, s.nick, s.phone, s.batch, +s.price || 0]; })
      ]
    }
  ];

  STUDENTS.forEach(function(s) {
    var name = (s.nick || s.first || "นักเรียน").slice(0, 15);
    sheets.push({ name: "TCAS-" + name, rows: [["วิชา", "สถานะ"], ["คณิตศาสตร์", "ตามแผน"]] });
    sheets.push({ name: "ม.ปลาย-" + name, rows: [["วิชา", "สถานะ"], ["ฟิสิกส์", "ตามแผน"]] });
  });

  api("sheet", { title: "TCAS Report", sheets: sheets })
    .then(function(res) { alert("สร้างสำเร็จ! เปิด Google Sheet ได้ที่:\n" + res.url); })
    .catch(function(err) { toast("สร้างไม่สำเร็จ: " + err.message); });
}

function backToHome() {
  $("detail").hidden = true;
  $("home").hidden = false;
  renderHome();
}

function logout() {
  localStorage.removeItem("tcas-token");
  TOKEN = "";
  $("home").hidden = true;
  $("login").hidden = false;
  $("code").value = "";
  $("who").innerHTML = "";
}

if (TOKEN && API_URL) {
  api("me")
    .then(function(me) {
      ME = me;
      $("login").hidden = true;
      $("home").hidden = false;
      loadData();
    })
    .catch(function() { logout(); });
}
</script>
</body>
</html>
