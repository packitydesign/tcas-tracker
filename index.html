function addMo(s,m){const d=D0(s),day=d.getDate();d.setMonth(d.getMonth()+m);if(d.getDate()!==day)d.setDate(0);return iso(d)}
function hpInfo(st,p){const r=(st.hp||{})[p.k];if(!r||!r.on)return null;const mo=+r.mo||p.mo,exp=r.enr?addMo(r.enr,mo):"",days=exp?Math.round((D0(exp)-D0(TODAY))/864e5):null;
  const done=p.it.reduce((n,x)=>n+Math.min(x.h,(st.hw||{})[x.c]||0),0);

  const ps=r.ps||r.enr||"",pe=r.pe||exp||"",ok=ps&&pe&&D0(pe)>D0(ps),pf=ok?Math.max(0,Math.min(1,(D0(TODAY)-D0(ps))/(D0(pe)-D0(ps)))):null,pdays=pe?Math.round((D0(pe)-D0(TODAY))/864e5):null;
  return{p,r,mo,exp,days,done,total:p.h,rem:Math.max(0,p.h-done),fin:p.h-done<.05,f,ps,pe,pf,pdays,plan:p.h*(pf||0),np:pf==null,n:1}}

/* calc */
const tdates=(p,t)=>t===1?{start:p.ustart||p.start,end:p.uend||p.end}:{start:p.start,end:p.end};
function tspans(st){const o=[];SUBJ.forEach(s=>{const p=st.subj[s];if(!p.on)return;[0,1].forEach(t=>{if(p.t[t]){const d=tdates(p,t);o.push({s,t,start:d.start,end:d.end})}})});return o}
function frac(p,t){const d=tdates(p,t||0);if(!d.start||!d.end||!(D0(d.end)>D0(d.start)))return null;return Math.max(0,Math.min(1,(D0(TODAY)-D0(d.start))/(D0(d.end)-D0(d.start))))}
function agg(st,s,t){let total=0,done=0,plan=0,n=0,np=false;
  SUBJ.forEach(sj=>{if(s!=null&&sj!==s)return;const p=st.subj[sj];if(!p.on)return;
    C.forEach(x=>{if(x.s!==sj||(t!=null&&x.t!==t)||!p.t[x.t])return;const f=frac(p,x.t);total+=x.h;done+=Math.min(x.h,st.w[x.c]||0);plan+=x.h*(f||0);n++;if(f==null)np=true})});
  return{total,done,plan,n,np}}
function chip(a){if(!a.n)return'<span class="chip wait">–</span>';if(a.np)return'<span class="chip wait">ยังไม่ตั้งแผน</span>';
  const g=a.done-a.plan;if(Math.abs(g)<.05)return'<span class="chip ok">ตามแผน</span>';
  return g>0?`<span class="chip ok">ล้ำหน้า +\${fh(g)} ชม.</span>`:`<span class="chip bad">ล่าช้า \${fh(-g)} ชม.</span>`}
function due(st){let b=null;tspans(st).forEach(z=>{if(!z.end)return;const a=agg(st,z.s,z.t);if(!a.n||a.total-a.done<.05)return;
  const d=Math.round((D0(z.end)-D0(TODAY))/864e5);if(!b||d<b.d)b={d,s:z.s+" ("+TR[z.t]+")",r:Math.max(0,a.total-a.done)}});return b}
function dueTxt(st){const b=due(st);if(!b)return"–";return b.d<0?`<span class="chip bad">เลยกำหนด \${-b.d} วัน</span>`:`อีก \${b.d} วัน`}

const mon=s=>{const d=D0(s),k=(d.getDay()+6)%7;d.setDate(d.getDate()-k);return iso(d)};
const addDays=(s,n)=>{const d=D0(s);d.setDate(d.getDate()+n);return iso(d)};
function weeks(st){const E=tspans(st).filter(x=>x.start);if(!E.length)return[];
  const a=E.map(x=>x.start).sort()[0],cw=mon(TODAY);
  let w=mon(a);const out=[];while(w<=cw&&out.length<80){out.push(w);w=addDays(w,7)}return out}
function wauto(st,s,w){const p=st.subj[s];if(!p.on)return 0;let r=0;
  [0,1].forEach(t=>{if(!p.t[t])return;const d=tdates(p,t);if(!d.start||!d.end||!(D0(d.end)>D0(d.start)))return;
    const a=Math.max(D0(w),D0(d.start)),b=Math.min(D0(addDays(w,7)),D0(d.end)),dy=Math.max(0,(b-a)/864e5);
    r+=agg(st,s,t).total*dy/((D0(d.end)-D0(d.start))/864e5)});return r}
function wplan(st,s,w){const o=(st.wp||{})[w];if(st.subj[s].on&&o&&o[s]!==undefined)return o[s];return wauto(st,s,w)}
const wact=(st,s,w)=>((st.wk||{})[w]||{})[s]||0;
function wtot(st,w){let a=0,p=0;SUBJ.forEach(s=>{if(!st.subj[s].on)return;a+=wact(st,s,w);p+=wplan(st,s,w)});return{a,p}}

    const alertTag = needsAlert(s) ? `<span class="alert-badge">🔔 ต้องติดตาม</span>` : ``;
    return`<tr class="rw"><td><div class="nmc">${av(s,36)}<div><button class="lnk" data-open="${s.id}">${esc(nm(s))||"(ยังไม่ใส่ชื่อ)"}</button>${alertTag}</div></div></td><td>${esc(sn(s))}</td><td>฿${(+s.price||0).toLocaleString()}</td><td>${esc(s.batch)}</td>
    <td>${chip(a)}</td><td>${dueTxt(s)}</td></tr>`}).join("")+`</tbody>`:`<p class="sub">ยังไม่มีนักเรียน</p>`;
}

function detailHtml(st){
  const F=(k,l,type="text",ph="")=>`<div><label class="l" for="f_${k}">${l}</label><input id="f_${k}" type="${type}" data-f="${k}" value="${esc(st[k])}" placeholder="${ph}"></div>`;
  return`<div class="tb"><button id="back">← กลับไปรายชื่อ</button><button id="gsheet" class="primary">📗 สร้าง Google Sheet ใน Drive ของฉัน</button></div>
  <div class="nmc" style="margin-bottom:16px">${av(st,60)}<div><h1>${esc(nm(st))||"นักเรียนใหม่"}${needsAlert(st)?'<span class="alert-badge">🔔 สัปดาห์นี้ต้องได้รับการติดตาม</span>':''}</h1></div></div>
  <section class="panel"><h2>🧸 ข้อมูลนักเรียน</h2><div class="fg f">${F("first","ชื่อ")}${F("last","สกุล")}${F("nick","ชื่อเล่น")}${F("phone","เบอร์โทร")}${F("price","ราคาคอร์ส (หลังหักส่วนลดแล้ว) - บาท","number")}</div></section>`;
}

/* events */
document.addEventListener("click",e=>{
  const el=e.target.closest("button");if(!el)return;
  if(el.id==="doLogin")doLogin();
  else if(el.id==="logout")logout();
  else if(el.id==="refresh"){pull(false).then(()=>render())}
  else if(el.id==="addsub"){
    const n=(\$("newsub").value||"").trim();if(!n)return toast("ใส่ชื่อก่อน");
    api("addUser",{name:n}).then(r=>{alert("รหัสเข้าใช้: "+r.code);return loadUsers()}).then(()=>render());
  }
  else if(el.dataset.du){
    if(confirm("ยืนยันลบ Sub user?")) api("delUser",{id:el.dataset.du}).then(()=>loadUsers()).then(()=>render());
  }
  else if(el.dataset.open){cur=el.dataset.open;render();}
  else if(el.id==="back"){cur=null;render();}
  else if(el.id==="add"){
    const s=blank();S.push(s);save(s,true);cur=s.id;render();
  }
  else if(el.id==="gsheet"){const st=S.find(x=>x.id===cur);if(st)mkSheet(wbAllList([st]),"รายงาน "+(st.first||"นักเรียน")+" "+TODAY)}
  else if(el.id==="gsheetAll"){mkSheet(wbAllList(visible()),"ภาพรวมนักเรียน "+TODAY)}
  else if(el.dataset.hv){hv=el.dataset.hv;sf="";render()}
});

document.addEventListener("input",e=>{
  const el=e.target;
  if(el.id==="q"){q=el.value;table();return}
  const st=S.find(s=>s.id===cur);if(!st||!el.dataset.f)return;
  st[el.dataset.f]=el.value;save(st,false);
});

async function init(){
  const url=apiUrl(), tok=localStorage.getItem("tcas-token");
  if(url&&tok){
    TOKEN=tok;
    try{const m=await api("me");await enter(m);}catch(e){logout()}
  }
}
init();
</script>
